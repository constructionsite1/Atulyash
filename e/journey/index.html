<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Atulyash Grain Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@500;600&display=swap">
<style>
/* Phone first. Three stations in one always-running line (SVG + SMIL, no libraries).
   Phone: stations stacked with a flowing connector between them. From 900px: three in a row. */
:root{
  --ground:#FCFAF5; --card:#FFFFFF; --ink:#16261F; --muted:#5B6B60;
  --olive:#2A530F; --gold:#CC9E4A; --line:#E7E1D3;
  --display:"Young Serif",Georgia,serif; --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink)}
body{font:500 18px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:40px 16px 56px}
.note{font-size:15px;color:var(--muted);margin:0 0 28px;max-width:60ch}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
h2{font:400 clamp(34px,8vw,52px)/1.08 var(--display);color:var(--olive);margin:0;max-width:16ch}
.lede{margin:12px 0 0;max-width:46ch}
.pause{flex:none;min-height:44px;padding:0 16px;border:1.5px solid var(--olive);border-radius:999px;background:var(--card);
  color:var(--olive);font:600 16px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pause:focus-visible{outline:3px solid var(--olive);outline-offset:3px}
.pause svg{width:14px;height:14px}
.line{display:grid;grid-template-columns:1fr}
.station{margin:0}
.pic{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.pic svg{display:block;width:100%;height:auto}
.pic .t{font:400 18px var(--display);fill:var(--olive)}
.pic .nb{fill:var(--olive)}
.pic .nn{font:600 13px var(--body);fill:#fff}
.pic .pl{fill:#fff;stroke:#E2D3B0;stroke-width:1}
.pic .l{font:600 12px var(--body);fill:var(--olive)}
.pic .ld{stroke:#A9784A;stroke-width:1.3;fill:none;stroke-dasharray:2 3;stroke-linecap:round}
.pic .dt{fill:var(--gold);stroke:#fff;stroke-width:1.5}
.join{display:block;width:40px;height:56px;margin:8px auto}
.join path{stroke:var(--gold);stroke-width:3;fill:none;stroke-dasharray:4 9;stroke-linecap:round;animation:flow 1s linear infinite}
.join .h{display:none}
@keyframes flow{to{stroke-dashoffset:-13}}
.paused .join path{animation-play-state:paused}
@media (min-width:900px){
  .wrap{padding:72px 32px}
  .line{grid-template-columns:1fr 48px 1fr 48px 1fr;align-items:start}
  .join{width:48px;height:40px;margin:130px 0 0}
  .join .v{display:none}
  .join .h{display:inline}
}
@media (prefers-reduced-motion:reduce){.join path{animation:none}}
</style>

</head>
<body>
<div class="wrap">
  <p class="note">Draft for review (website E). The drawings are illustrations, not photos of the Atulyash mill. Step details are still to be checked with the founder.</p>

  <div class="head">
    <div>
      <h2>From wheat to your door</h2>
      <p class="lede">How your atta is made, packed and brought to you.</p>
    </div>
    <button class="pause" id="pause" type="button" aria-pressed="false">
      <svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="8.5" y="1" width="3.5" height="12" rx="1" fill="currentColor"/></svg>
      <span>Pause</span>
    </button>
  </div>

  <div class="line" id="line">

    <!-- 1. Clean and mill -->
    <figure class="station">
      <div class="pic">
        <svg viewBox="0 0 340 284" role="img" aria-label="Wheat grains drop through a shaking sieve, slide into a wooden hopper and are ground by a turning stone chakki. Brown atta pours out into a tray.">
          <defs>
            <pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0H5M0 0V5" stroke="#A9784A" stroke-width=".8"/></pattern>
            <clipPath id="runnerTop"><circle r="53"/></clipPath>
          </defs>
          <g transform="translate(0 56)">
          <rect width="340" height="220" fill="#FBF3DF"/>
          <rect y="200" width="340" height="20" fill="#EFE3C6"/>
          <!-- wheat -->
          <g fill="none" stroke="#B8862F" stroke-width="2.4" stroke-linecap="round">
            <g><animateTransform attributeName="transform" type="rotate" values="-3 34 200;3 34 200;-3 34 200" dur="4s" repeatCount="indefinite"/>
              <path d="M34 200V86"/><g fill="#E8B84A" stroke="none"><ellipse cx="30" cy="80" rx="4" ry="8"/><ellipse cx="38" cy="74" rx="4" ry="8"/><ellipse cx="30" cy="66" rx="4" ry="8"/><ellipse cx="38" cy="60" rx="4" ry="8"/><ellipse cx="34" cy="52" rx="3.5" ry="7"/></g></g>
            <g><animateTransform attributeName="transform" type="rotate" values="2 58 200;-3 58 200;2 58 200" dur="4.6s" repeatCount="indefinite"/>
              <path d="M58 200V76"/><g fill="#E8B84A" stroke="none"><ellipse cx="54" cy="70" rx="4" ry="8"/><ellipse cx="62" cy="64" rx="4" ry="8"/><ellipse cx="54" cy="56" rx="4" ry="8"/><ellipse cx="62" cy="50" rx="4" ry="8"/><ellipse cx="58" cy="42" rx="3.5" ry="7"/></g></g>
            <path d="M46 200V120M22 200V140M70 200V132" stroke="#C99A44"/>
          </g>
          <!-- chute from sieve to hopper -->
          <path d="M120 92L222 104" stroke="#8A5E36" stroke-width="7" stroke-linecap="round"/>
          <!-- sieve on legs -->
          <path d="M98 74V200M162 74V200" stroke="#8A5E36" stroke-width="3"/>
          <g><animateTransform attributeName="transform" type="translate" values="0 0;3 0;-3 0;0 0" dur=".45s" repeatCount="indefinite"/>
            <ellipse cx="130" cy="72" rx="40" ry="10" fill="url(#mesh)" stroke="#8A5E36" stroke-width="4"/>
          </g>
          <!-- dust and husk falling away -->
          <g fill="#B9AE98">
            <circle r="1.8"><animateMotion path="M100 80q-6 30-10 110" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle>
            <circle r="1.4"><animateMotion path="M160 80q8 30 12 110" dur="1.9s" begin=".6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.9s" begin=".6s" repeatCount="indefinite"/></circle>
            <rect width="4" height="1.6" rx=".8" fill="#D9C08A"><animateMotion path="M110 80q-10 40-18 110" dur="2.2s" begin="1.1s" repeatCount="indefinite" rotate="auto"/><animate attributeName="opacity" values="1;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></rect>
          </g>
          <!-- grains: ear, onto sieve, down the chute, into the hopper -->
          <g fill="#CC9E4A">
            <ellipse rx="3.4" ry="2.2"><animateMotion path="M60 52Q96 20 126 66L130 88L218 100L234 108" dur="2.4s" repeatCount="indefinite" rotate="auto"/></ellipse>
            <ellipse rx="3.4" ry="2.2"><animateMotion path="M36 60Q90 16 132 66L130 88L218 100L234 108" dur="2.4s" begin=".8s" repeatCount="indefinite" rotate="auto"/></ellipse>
            <ellipse rx="3.4" ry="2.2"><animateMotion path="M60 46Q100 18 136 66L130 88L218 100L234 108" dur="2.4s" begin="1.6s" repeatCount="indefinite" rotate="auto"/></ellipse>
          </g>
          <!-- hopper -->
          <polygon points="206,96 262,96 244,126 226,126" fill="#C58E57" stroke="#8A5E36" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M213 101H255" stroke="#E8B84A" stroke-width="4" stroke-linecap="round"/>
          <path d="M235 126V138" stroke="#CC9E4A" stroke-width="2.5" stroke-dasharray="2 3"><animate attributeName="stroke-dashoffset" values="0;-10" dur=".6s" repeatCount="indefinite"/></path>
          <!-- base stone -->
          <path d="M180 162V186A55 14 0 0 0 290 186V162Z" fill="#7C776C"/>
          <ellipse cx="235" cy="162" rx="55" ry="14" fill="#8C877C"/>
          <!-- runner stone (turning) -->
          <path d="M182 142V160A53 13 0 0 0 288 160V142Z" fill="#9A958A"/>
          <g transform="translate(235 142) scale(1 .245)">
            <circle r="53" fill="#B3AEA2"/>
            <g clip-path="url(#runnerTop)">
              <g stroke="#8C877C" stroke-width="3">
                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
                <path d="M0 0L53 -10M0 0L30 44M0 0L-40 35M0 0L-48 -22M0 0L8 -53M14 -5L50 18M-10 12L-20 50M-14 -8L-52 4M6 -14L36 -40"/>
              </g>
            </g>
            <circle r="11" fill="#5D584F"/>
          </g>
          <!-- spout and atta into tray -->
          <path d="M288 176H306V186" stroke="#7C776C" stroke-width="6" fill="none" stroke-linejoin="round"/>
          <path d="M306 188V200" stroke="#C9A27A" stroke-width="5" stroke-dasharray="3 3"><animate attributeName="stroke-dashoffset" values="0;-12" dur=".5s" repeatCount="indefinite"/></path>
          <path d="M286 204h42l-4 10h-34z" fill="#A9784A"/>
          <path d="M292 204q14-12 30 0z" fill="#C9A27A"/>
          <g fill="#7A4E2A"><circle cx="302" cy="201" r=".9"/><circle cx="309" cy="198" r=".9"/><circle cx="315" cy="202" r=".9"/></g>
                  </g>
          <circle cx="28" cy="28" r="13" class="nb"/><text x="28" y="32.5" text-anchor="middle" class="nn">1</text><text class="t" x="50" y="34">Milled on stone</text><path class="ld" d="M131 90Q123 104 131 117"/><circle class="dt" cx="131" cy="117" r="3.5"/><rect class="pl" x="90" y="70" width="125" height="20" rx="10"/><text class="l" x="152" y="84.2" text-anchor="middle">Cleaned in stages</text><path class="ld" d="M284 114Q276 158 284 203"/><circle class="dt" cx="284" cy="203" r="3.5"/><rect class="pl" x="241" y="94" width="94" height="20" rx="10"/><text class="l" x="288" y="108.2" text-anchor="middle">Stone chakki</text><path class="ld" d="M52 252Q44 242 52 232"/><circle class="dt" cx="52" cy="232" r="3.5"/><rect class="pl" x="14" y="244" width="125" height="20" rx="10"/><text class="l" x="76" y="258.2" text-anchor="middle">MP Sharbati wheat</text><path class="ld" d="M283 254Q296 250 304 258"/><circle class="dt" cx="304" cy="258" r="3.5"/><rect class="pl" x="133" y="244" width="150" height="20" rx="10"/><text class="l" x="208" y="258.2" text-anchor="middle">Chokar (bran) kept in</text>
        </svg>
      </div>
    </figure>

    <svg class="join" viewBox="0 0 48 56" aria-hidden="true"><path class="v" d="M24 4V52"/><path class="h" d="M4 20H44"/></svg>

    <!-- 2. Pack -->
    <figure class="station">
      <div class="pic">
        <svg viewBox="0 0 340 284" role="img" aria-label="Fresh atta pours from the chakki into an Atulyash pack on a moving belt. Each pack fills up and moves along to join the full ones.">
          <defs>
            <clipPath id="fillClip"><rect x="92" width="56" y="190" height="0">
              <animate attributeName="y" values="190;190;98;98" keyTimes="0;.36;.9;1" dur="3.4s" repeatCount="indefinite"/>
              <animate attributeName="height" values="0;0;92;92" keyTimes="0;.36;.9;1" dur="3.4s" repeatCount="indefinite"/>
            </rect></clipPath>
            <g id="empty"><rect width="56" height="92" rx="5" fill="#F4EBD8" stroke="#C9B89A" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M8 10h40" stroke="#E3D5BA" stroke-width="3" stroke-linecap="round"/></g>
          </defs>
          <g transform="translate(0 56)">
          <rect width="340" height="220" fill="#F3EEE4"/>
          <!-- pipe from the chakki -->
          <path d="M0 30H112Q120 30 120 38V58" stroke="#7C776C" stroke-width="10" fill="none"/>
          <circle cx="40" cy="30" r="3" fill="#5D584F"/>
          <!-- stream, only while a pack fills -->
          <g opacity="0">
            <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.33;.37;.88;.92;1" dur="3.4s" repeatCount="indefinite"/>
            <path d="M120 62V100" stroke="#C9A27A" stroke-width="7" stroke-dasharray="5 3"><animate attributeName="stroke-dashoffset" values="0;-16" dur=".45s" repeatCount="indefinite"/></path>
            <g fill="#7A4E2A"><circle cx="119" cy="72" r=".9"/><circle cx="121" cy="86" r=".9"/></g>
          </g>
          <!-- belt -->
          <rect x="0" y="190" width="340" height="10" fill="#4E5A52"/>
          <path d="M0 195H340" stroke="#6E7A72" stroke-width="2" stroke-dasharray="8 12">
            <animate attributeName="stroke-dashoffset" values="0;-80;-80" keyTimes="0;.3;1" dur="3.4s" repeatCount="indefinite"/>
          </path>
          <g fill="#3B453F"><circle cx="20" cy="207" r="6"/><circle cx="120" cy="207" r="6"/><circle cx="220" cy="207" r="6"/><circle cx="320" cy="207" r="6"/></g>
          <!-- packs move along one place each cycle -->
          <g>
            <animateTransform attributeName="transform" type="translate" values="0 0;80 0;80 0" keyTimes="0;.3;1" dur="3.4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .25 1;0 0 1 1"/>
            <use href="#empty" x="-68" y="98"/>
            <use href="#empty" x="12" y="98"/>
            <image href="img/pack-s.webp" x="92" y="98" width="56" height="92"/>
            <image href="img/pack-s.webp" x="172" y="98" width="56" height="92"/>
            <image href="img/pack-s.webp" x="252" y="98" width="56" height="92"/>
          </g>
          <!-- the pack under the spout, filling from the bottom -->
          <image href="img/pack-s.webp" x="92" y="98" width="56" height="92" clip-path="url(#fillClip)"/>
                  </g>
          <circle cx="28" cy="28" r="13" class="nb"/><text x="28" y="32.5" text-anchor="middle" class="nn">2</text><text class="t" x="50" y="34">Packed in small batches</text><path class="ld" d="M138 104Q123 107 124 110"/><circle class="dt" cx="124" cy="110" r="3.5"/><rect class="pl" x="138" y="94" width="169" height="20" rx="10"/><text class="l" x="222" y="108.2" text-anchor="middle">Straight from the chakki</text><path class="ld" d="M128 256Q120 241 128 226"/><circle class="dt" cx="128" cy="226" r="3.5"/><rect class="pl" x="75" y="248" width="206" height="20" rx="10"/><text class="l" x="178" y="262.2" text-anchor="middle">Nothing added, nothing removed</text>
        </svg>
      </div>
    </figure>

    <svg class="join" viewBox="0 0 48 56" aria-hidden="true"><path class="v" d="M24 4V52"/><path class="h" d="M4 20H44"/></svg>

    <!-- 3. Deliver -->
    <figure class="station">
      <div class="pic">
        <svg viewBox="0 0 340 284" role="img" aria-label="An Atulyash rider brings a pack down the street to a front door. The door opens, Veer peeks out, the pack is left at the door and the rider heads off.">
          <g transform="translate(0 56)">
          <rect width="340" height="220" fill="#E6EFE9"/>
          <!-- city behind -->
          <g fill="#D3E0D7"><rect x="10" y="96" width="34" height="84"/><rect x="50" y="70" width="26" height="110"/><rect x="82" y="104" width="40" height="76"/><rect x="128" y="86" width="30" height="94"/><rect x="164" y="112" width="44" height="68"/></g>
          <circle cx="118" cy="146" r="20" fill="#9FC79B"/><path d="M118 164V182" stroke="#8A5E36" stroke-width="4"/>
          <!-- house -->
          <rect x="236" y="92" width="96" height="90" fill="#F6E7CF"/>
          <path d="M228 96L284 58L340 96Z" fill="#9A3B22"/>
          <rect x="250" y="108" width="22" height="20" fill="#CFE0EA" stroke="#A9784A" stroke-width="2"/>
          <rect x="268" y="128" width="38" height="54" fill="#5A3A22"/>
          <image href="img/veer-s.webp" x="270" y="132" width="36" height="47" opacity="0">
            <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.58;.62;.86;.9;1" dur="8s" repeatCount="indefinite"/>
          </image>
          <rect x="268" y="128" width="38" height="54" fill="#8A5E36">
            <animate attributeName="width" values="38;38;7;7;38;38" keyTimes="0;.54;.6;.86;.92;1" dur="8s" repeatCount="indefinite"/>
          </rect>
          <!-- pack left at the door -->
          <image href="img/pack-s.webp" x="310" y="160" width="14" height="23" opacity="0">
            <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.66;.68;.97;1" dur="8s" repeatCount="indefinite"/>
          </image>
          <!-- road -->
          <rect y="182" width="340" height="38" fill="#C9C6BC"/>
          <path d="M0 202H340" stroke="#F4F1E8" stroke-width="3" stroke-dasharray="16 14"/>
          <!-- rider -->
          <g>
            <animateTransform attributeName="transform" type="translate" values="-90 0;196 0;196 0;430 0" keyTimes="0;.5;.78;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines=".3 0 .3 1;0 0 1 1;.5 0 .9 .6"/>
            <rect x="8" y="148" width="24" height="22" rx="3" fill="#2A530F"/>
            <image href="img/pack-s.webp" x="14" y="150" width="12" height="20">
              <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.66;.68;.99;1" dur="8s" repeatCount="indefinite"/>
            </image>
            <path d="M6 176Q10 166 26 166H46L54 150H60L52 170Q62 168 66 176Z" fill="#CC9E4A"/>
            <path d="M54 150L58 138" stroke="#3B453F" stroke-width="3" stroke-linecap="round"/>
            <circle cx="16" cy="180" r="8" fill="#2B302C"/><circle cx="16" cy="180" r="3" fill="#C9C6BC"/>
            <circle cx="58" cy="180" r="8" fill="#2B302C"/><circle cx="58" cy="180" r="3" fill="#C9C6BC"/>
            <path d="M30 166L36 144Q38 138 44 140L52 146" stroke="#2A530F" stroke-width="7" stroke-linecap="round" fill="none"/>
            <path d="M34 166L44 168" stroke="#3B453F" stroke-width="5" stroke-linecap="round"/>
            <circle cx="40" cy="132" r="7.5" fill="#9A3B22"/>
            <path d="M44 132h4" stroke="#2B302C" stroke-width="3" stroke-linecap="round"/>
          </g>
                  </g>
          <circle cx="28" cy="28" r="13" class="nb"/><text x="28" y="32.5" text-anchor="middle" class="nn">3</text><text class="t" x="50" y="34">At your door the next day</text><path class="ld" d="M40 100Q32 125 40 150"/><circle class="dt" cx="40" cy="150" r="3.5"/><rect class="pl" x="9" y="80" width="150" height="20" rx="10"/><text class="l" x="84" y="94.2" text-anchor="middle">South and North Delhi</text><path class="ld" d="M290 100Q282 143 290 186"/><circle class="dt" cx="290" cy="186" r="3.5"/><rect class="pl" x="181" y="80" width="150" height="20" rx="10"/><text class="l" x="258" y="94.2" text-anchor="middle">Milled the day before</text><path class="ld" d="M162 252Q200 243 222 234"/><circle class="dt" cx="222" cy="234" r="3.5"/><rect class="pl" x="64" y="244" width="107" height="20" rx="10"/><text class="l" x="118" y="258.2" text-anchor="middle">Our own riders</text><path class="ld" d="M317 252Q309 244 317 236"/><circle class="dt" cx="317" cy="236" r="3.5"/><rect class="pl" x="193" y="244" width="138" height="20" rx="10"/><text class="l" x="262" y="258.2" text-anchor="middle">Once, or every week</text>
        </svg>
      </div>
    </figure>

  </div>
</div>

<script>
(()=>{
  const btn=document.getElementById('pause'), line=document.getElementById('line');
  const svgs=[...line.querySelectorAll('.pic svg')];
  const label=btn.querySelector('span'), icon=btn.querySelector('svg');
  const pauseIcon=icon.innerHTML, playIcon='<path d="M3 1.5L12.5 7L3 12.5Z" fill="currentColor"/>';
  let userPaused=false, visible=true;
  function apply(){
    const stop=userPaused||!visible;
    svgs.forEach(s=>stop?s.pauseAnimations():s.unpauseAnimations());
    line.classList.toggle('paused',stop);
    btn.setAttribute('aria-pressed',String(userPaused));
    label.textContent=userPaused?'Play':'Pause';
    icon.innerHTML=userPaused?playIcon:pauseIcon;
  }
  btn.addEventListener('click',()=>{userPaused=!userPaused;apply();});
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    userPaused=true;
    svgs.forEach(s=>s.setCurrentTime(5.2)); // a still that tells the story: pack filling, rider at the door
  }
  if('IntersectionObserver' in window){
    new IntersectionObserver(es=>{visible=es[0].isIntersecting;apply();}).observe(line);
  }
  apply();
})();
</script>

</body>
</html>
