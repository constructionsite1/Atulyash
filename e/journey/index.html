<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Atulyash Grain Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@500;600&family=Kalam:wght@400&display=swap">
<style>
/* One floating stream, phone first. Style 7: flat geometric shapes with a light printed grain.
   Everything drifts on slow, noise-driven currents; handwritten notes annotate the parts. */
:root{
  --ground:#FCFAF5; --ink:#16261F; --muted:#5B6B60; --olive:#2A530F; --gold:#CC9E4A;
  --display:"Young Serif",Georgia,serif; --body:"Figtree","Segoe UI",system-ui,sans-serif; --hand:"Kalam","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink)}
body{font:500 18px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:36px 16px 48px}
.note{font-size:15px;color:var(--muted);margin:0 0 26px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
h2{font:400 clamp(34px,9vw,48px)/1.06 var(--display);color:var(--olive);margin:0}
.lede{margin:10px 0 0}
.pause{flex:none;min-height:44px;padding:0 16px;border:1.5px solid var(--olive);border-radius:999px;background:#fff;
  color:var(--olive);font:600 16px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pause:focus-visible{outline:3px solid var(--olive);outline-offset:3px}
.pause svg{width:14px;height:14px}
.stage{position:relative;margin-top:12px}
.stage svg{display:block;width:100%;height:auto;overflow:visible}
.paper{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.4;z-index:5}
.hand{font:400 19px var(--hand);fill:var(--olive)}
.arrow{fill:none;stroke:var(--olive);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.end{margin:8px 0 0;font:400 22px/1.3 var(--hand);color:var(--olive);text-align:center}
</style>

</head>
<body>
<div class="wrap">
  <p class="note">Draft for review (website E). The drawings are illustrations, not photos of the Atulyash mill. Step details are still to be checked with the founder.</p>
  <div class="head">
    <div>
      <h2>From wheat to your door</h2>
      <p class="lede">How your atta is made and brought to you.</p>
    </div>
    <button class="pause" id="pause" type="button" aria-pressed="false">
      <svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="8.5" y="1" width="3.5" height="12" rx="1" fill="currentColor"/></svg>
      <span>Pause</span>
    </button>
  </div>

  <div class="stage" id="stage">
  <svg id="w" viewBox="0 0 400 1940" role="img" aria-label="Sharbati wheat floats in the air. Its grains drift through a cleaning sieve while dust and husk float away, fall from a wooden hopper into a turning stone chakki, and come out as a ribbon of brown atta with bran in it. The ribbon pours into an Atulyash pack. A rider then carries the pack along a winding road to a front door, where Veer peeks out.">
    <defs>
      <symbol id="wheat" overflow="visible">
        <path d="M0 0C2 50-2 100 0 150" fill="none" stroke="#3F7F3A" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M0 70C18 55 34 50 46 28C32 52 15 63 0 80Z" fill="#449342"/>
        <path d="M0 100C-16 86-33 82-44 60C-29 84-13 95 0 110Z" fill="#3A7D38"/>
        <path d="M0 2V-92" stroke="#B8862F" stroke-width="2"/>
        <g fill="#CC9E4A">
          <ellipse cx="-7" cy="-14" rx="6" ry="11" transform="rotate(-28 -7 -14)"/><ellipse cx="7" cy="-14" rx="6" ry="11" transform="rotate(28 7 -14)" fill="#B98A36"/>
          <ellipse cx="-7" cy="-31" rx="6" ry="11" transform="rotate(-28 -7 -31)"/><ellipse cx="7" cy="-31" rx="6" ry="11" transform="rotate(28 7 -31)" fill="#B98A36"/>
          <ellipse cx="-7" cy="-48" rx="6" ry="11" transform="rotate(-28 -7 -48)"/><ellipse cx="7" cy="-48" rx="6" ry="11" transform="rotate(28 7 -48)" fill="#B98A36"/>
          <ellipse cx="-6" cy="-65" rx="5.5" ry="10" transform="rotate(-26 -6 -65)"/><ellipse cx="6" cy="-65" rx="5.5" ry="10" transform="rotate(26 6 -65)" fill="#B98A36"/>
          <ellipse cx="0" cy="-86" rx="5" ry="10"/>
        </g>
      </symbol>
      <symbol id="grain" overflow="visible"><ellipse rx="4.6" ry="2.8" fill="#CC9E4A"/><path d="M-4 .6Q0 2.6 4 .6" stroke="#A97B2E" stroke-width="1" fill="none"/></symbol>
      <pattern id="mesh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0H6M0 0V6" stroke="#B98A50" stroke-width=".9"/></pattern>
      <clipPath id="topFace"><circle r="120"/></clipPath>
    </defs>

    <!-- notes (handwritten) -->
    <g id="notes">
      <text class="hand" x="205" y="36" text-anchor="middle" transform="rotate(-3 205 36)">pure MP Sharbati wheat</text>
      <text class="hand" x="14" y="470" transform="rotate(-2 14 470)">cleaned in<tspan x="14" dy="23">several stages</tspan></text>
      <text class="hand" x="388" y="602" text-anchor="end" transform="rotate(3 388 602)">dust and husk<tspan x="388" dy="23">float away</tspan></text>
      <text class="hand" x="14" y="744" transform="rotate(-3 14 744)">stone chakki,<tspan x="14" dy="23">turning slow</tspan></text>
      <text class="hand" x="14" y="1078" transform="rotate(2 14 1078)">chokar (bran)<tspan x="14" dy="23">stays in</tspan></text>
      <text class="hand" x="14" y="1136" transform="rotate(-2 14 1136)">straight into<tspan x="14" dy="23">your pack</tspan></text>
      <text class="hand" x="392" y="1362" text-anchor="end" transform="rotate(3 392 1362)">nothing added,<tspan x="392" dy="23">nothing removed</tspan></text>
      <text class="hand" x="388" y="1474" text-anchor="end" transform="rotate(-2 388 1474)">milled the day before,<tspan x="388" dy="23">at your door the next</tspan></text>
      <text class="hand" x="152" y="1594" transform="rotate(-3 152 1594)">our own riders</text>
      <text class="hand" x="262" y="1922" text-anchor="middle" transform="rotate(2 262 1922)">your home</text>
    </g>
    <g id="arrows"></g>

    <!-- 1 wheat field (stalks are placed by script) -->
    <g id="field"></g>
    <g id="looseGrains"></g>

    <!-- 2 sieve -->
    <g id="sieve">
      <ellipse cx="0" cy="6" rx="98" ry="26" fill="#8A5E36"/>
      <ellipse cx="0" cy="0" rx="98" ry="26" fill="#A9784A"/>
      <ellipse cx="0" cy="0" rx="86" ry="20" fill="#F2E6CF"/>
      <ellipse cx="0" cy="0" rx="86" ry="20" fill="url(#mesh)"/>
    </g>
    <g id="dust"></g>

    <!-- 3 hopper + stone -->
    <g id="hopper">
      <polygon points="-75,0 75,0 30,90 -30,90" fill="#B5482A"/>
      <polygon points="40,0 75,0 30,90 14,90" fill="#94381F"/>
      <rect x="-80" y="-8" width="160" height="12" rx="2" fill="#CC9E4A"/>
      <rect x="-18" y="90" width="36" height="16" fill="#94381F"/>
      <g fill="#CC9E4A"><ellipse cx="-42" cy="-12" rx="9" ry="5.5"/><ellipse cx="-22" cy="-17" rx="9" ry="5.5"/><ellipse cx="0" cy="-19" rx="9" ry="5.5"/><ellipse cx="22" cy="-16" rx="9" ry="5.5"/><ellipse cx="42" cy="-11" rx="9" ry="5.5"/><ellipse cx="-30" cy="-6" rx="9" ry="5.5"/><ellipse cx="-8" cy="-9" rx="9" ry="5.5"/><ellipse cx="14" cy="-8" rx="9" ry="5.5"/><ellipse cx="34" cy="-4" rx="9" ry="5.5"/></g>
      <g fill="#B98A36"><ellipse cx="-12" cy="-26" rx="8" ry="5"/><ellipse cx="10" cy="-27" rx="8" ry="5"/></g>
    </g>
    <g id="fallGrains"></g>
    <ellipse id="stoneShadow" cx="200" cy="1036" rx="112" ry="10" fill="#E9E1D0"/>
    <g id="stone">
      <!-- bottom stone -->
      <path d="M-120 64V126A120 30 0 0 0 120 126V64Z" fill="#7F7A70"/>
      <path d="M60 64V150A120 30 0 0 0 120 126V64Z" fill="#6E695F"/>
      <ellipse cx="0" cy="64" rx="120" ry="30" fill="#5E5A51"/>
      <!-- spout -->
      <path d="M112 62H152V82H112Z" fill="#6E695F"/><path d="M146 60H158V84H146Z" fill="#5E5A51"/>
      <!-- top stone -->
      <path d="M-120 0V58A120 30 0 0 0 120 58V0Z" fill="#9A958A"/>
      <path d="M62 0V82A120 30 0 0 0 120 58V0Z" fill="#87827A"/>
      <g id="sideMarks" stroke="#827D73" stroke-width="3" stroke-linecap="round"></g>
      <g transform="scale(1 .25)">
        <circle r="120" fill="#AAA59A"/>
        <g clip-path="url(#topFace)"><g id="furrows" stroke="#958F84" stroke-width="5" stroke-linecap="round">
          <path d="M0 0L118 -20M0 0L60 102M0 0L-88 80M0 0L-110 -48M0 0L18 -118M30 -12L112 40M-22 26L-44 110M-30 -18L-116 10M14 -32L80 -88"/>
        </g></g>
        <circle r="26" fill="#3E3B35"/>
      </g>
    </g>

    <!-- atta ribbon -->
    <path id="ribbonShade" fill="none" stroke="#B88E66" stroke-width="20" stroke-linecap="round" transform="translate(2 2)"/>
    <path id="ribbon" fill="none" stroke="#C9A27A" stroke-width="18" stroke-linecap="round"/>
    <path id="ribbonHi" fill="none" stroke="#E3C9A4" stroke-width="4" stroke-linecap="round" transform="translate(-4 -3)" opacity=".85"/>
    <g id="bran" fill="#7A4E2A"></g>

    <!-- 4 pack -->
    <g id="pack"><image href="img/pack-m.webp" x="-65" y="0" width="130" height="213"/></g>

    <!-- 5 delivery: island, road, house, rider -->
    <g id="island">
      <path d="M144 1802Q168 1852 228 1870Q262 1884 302 1866Q358 1842 380 1802Z" fill="#A9784A"/>
      <path d="M300 1866Q358 1842 380 1802H330Q330 1846 300 1866Z" fill="#8A5E36"/>
      <ellipse cx="262" cy="1802" rx="118" ry="20" fill="#449342"/>
      <path id="road" d="M-30 1462C140 1440 60 1700 226 1808" fill="none" stroke="#C9A27A" stroke-width="22" stroke-linecap="round"/>
      <path d="M-30 1462C140 1440 60 1700 226 1808" fill="none" stroke="#FCFAF5" stroke-width="2" stroke-dasharray="10 10" opacity=".9"/>
      <rect x="210" y="1700" width="110" height="102" fill="#F3E3C7"/>
      <rect x="298" y="1700" width="22" height="102" fill="#E5D0AC"/>
      <polygon points="198,1704 332,1704 265,1650" fill="#9A3B22"/>
      <polygon points="265,1650 332,1704 300,1704" fill="#7E2F1B"/>
      <rect x="222" y="1720" width="24" height="20" fill="#CFE0EA"/><rect x="222" y="1728" width="24" height="3" fill="#A9784A"/>
      <rect x="250" y="1742" width="34" height="60" fill="#3F2A19"/>
      <image id="veer" href="img/veer-s.webp" x="252" y="1756" width="32" height="42" opacity="0"/>
      <rect id="door" x="250" y="1742" width="34" height="60" fill="#8A5E36"/>
      <image id="doorPack" href="img/pack-m.webp" x="288" y="1781" width="13" height="21" opacity="0"/>
    </g>
    <g id="rider">
      <rect x="-31" y="-41" width="18" height="16" rx="2" fill="#2A530F"/>
      <rect x="-27" y="-37" width="10" height="8" rx="1" fill="#CC9E4A"/>
      <path d="M-24-10Q-22-20-8-20H8L14-34H20L16-14Q24-14 26-8L-24-8Z" fill="#CC9E4A"/>
      <path d="M8-20L14-34H20L16-14Z" fill="#B98A36"/>
      <path d="M17-34L20-42" stroke="#3B453F" stroke-width="3" stroke-linecap="round"/>
      <path d="M-8-22L-2-40Q0-46 6-44L15-37" stroke="#2A530F" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M-6-22L7-18" stroke="#3B453F" stroke-width="5" stroke-linecap="round"/>
      <circle cx="0" cy="-51" r="7" fill="#9A3B22"/><path d="M4-51h5" stroke="#2B302C" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-16" cy="-7" r="7.5" fill="#2B302C"/><circle cx="-16" cy="-7" r="2.6" fill="#C9C6BC"/>
      <circle cx="18" cy="-7" r="7.5" fill="#2B302C"/><circle cx="18" cy="-7" r="2.6" fill="#C9C6BC"/>
    </g>
  </svg>
  <div class="paper" id="paper" aria-hidden="true"></div>
  </div>
</div>

<script>
(()=>{
const NS='http://www.w3.org/2000/svg', $=id=>document.getElementById(id);
const svg=$('w'), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;};
// smooth pseudo-noise: a few slow sines with unrelated periods, so nothing visibly repeats
const nz=(t,s)=>Math.sin(t*.61+s)*.55+Math.sin(t*1.13+s*1.7)*.3+Math.sin(t*1.97+s*2.9)*.15;
const lerp=(a,b,t)=>a+(b-a)*t, ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

/* printed grain: a small noise tile multiplied over the stage */
(()=>{const c=document.createElement('canvas');c.width=c.height=140;const g=c.getContext('2d'),d=g.createImageData(140,140);
  for(let i=0;i<d.data.length;i+=4){const v=255-Math.random()*26;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  g.putImageData(d,0,0);$('paper').style.background=`url(${c.toDataURL()})`;$('paper').style.backgroundSize='140px';})();

/* 1. wheat: floating stalks at different depths */
const stalks=[[92,182,1,-12],[178,150,.82,7],[302,196,1.05,11],[252,116,.6,-5],[46,330,.7,16],[352,338,.66,-12],[140,300,.55,-3]]
  .map(([x,y,s,r],i)=>({x,y,s,r,i,el:mk('use',{href:'#wheat',opacity:s<.7?.75:1},$('field'))}));
const earTip=st=>{const a=st.cur.r*Math.PI/180;return [st.cur.x+Math.sin(a)*-48*st.s*-1,st.cur.y-48*st.s*Math.cos(a)];};

/* loose grains drifting from the ears to the sieve */
const SIEVE={x:200,y:522}, HOP={x:200,y:700};
const loose=[...Array(11)].map((_,i)=>({el:mk('use',{href:'#grain'},$('looseGrains')),st:i%stalks.length,t:i/11,dur:5.5+(i%4)*.7,seed:i*2.3}));
/* grains falling from the sieve into the hopper, and from the hopper into the stone */
const fall=[...Array(6)].map((_,i)=>({el:mk('use',{href:'#grain'},$('fallGrains')),t:i/6}));
const drop=[...Array(4)].map((_,i)=>({el:mk('use',{href:'#grain'},$('fallGrains')),t:i/4}));
/* dust and husk */
const dust=[...Array(9)].map((_,i)=>({el:i%3?mk('circle',{r:1.6+(i%2),fill:'#BDB29C'},$('dust')):mk('rect',{width:6,height:2,rx:1,fill:'#D9C08A'},$('dust')),t:i/9,side:i%2?1:-1,seed:i*1.9}));

/* stone side marks (rotate around the drum) */
const marks=[...Array(12)].map((_,i)=>({el:mk('path',{d:''},$('sideMarks')),a:i/12*Math.PI*2,h:8+(i*7)%14,y0:12+(i*11)%30}));

/* bran specks riding the ribbon */
const bran=[...Array(16)].map((_,i)=>({el:mk('circle',{r:i%3?1.3:1.8},$('bran')),u:i/16}));

/* arrows: a hand-drawn curve with a small loop, drawn in once */
const ARROWS=[[150,46,104,104,18,1],[70,500,112,516,-10,0],[330,588,322,548,16,1],[60,778,104,858,-16,1],
  [96,1098,262,1104,-26,1],[70,1164,150,1196,14,0],[306,1340,246,1318,-12,1],[336,1508,270,1738,26,1],[156,1606,110,1612,10,0],[262,1900,262,1874,12,0]];
const arrowEls=ARROWS.map(([x1,y1,x2,y2,b,loop])=>{
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux,pts=[];
  for(let k=0;k<=48;k++){const t=k/48;let x=x1+dx*t+px*b*Math.sin(Math.PI*t),y=y1+dy*t+py*b*Math.sin(Math.PI*t);
    if(loop&&t>.3&&t<.5){const u=(t-.3)/.2*Math.PI*2,r=Math.min(7,L*.08);x+=ux*(Math.sin(u)*r)+px*(1-Math.cos(u))*r;y+=uy*(Math.sin(u)*r)+py*(1-Math.cos(u))*r;}
    pts.push([x,y]);}
  const [ax,ay]=pts[48],[bx,by]=pts[44],ang=Math.atan2(ay-by,ax-bx);
  const head=[-.5,.5].map(d=>`M${ax.toFixed(1)} ${ay.toFixed(1)}L${(ax-8*Math.cos(ang+d)).toFixed(1)} ${(ay-8*Math.sin(ang+d)).toFixed(1)}`).join('');
  const p=mk('path',{class:'arrow',d:'M'+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L')+head},$('arrows'));
  const len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=reduce?0:len;return {p,len};
});
let drawn=reduce;
function drawArrows(){if(drawn)return;drawn=true;arrowEls.forEach((a,i)=>{a.p.style.transition=`stroke-dashoffset 1.1s ease ${.25+i*.18}s`;a.p.style.strokeDashoffset=0;});}

const road=$('road'), roadLen=road.getTotalLength();
const ribbon=$('ribbon'), shade=$('ribbonShade'), hi=$('ribbonHi');

function render(T){
  // wheat
  stalks.forEach(st=>{
    const x=st.x+nz(T*.5,st.i*3.1)*12*st.s, y=st.y+nz(T*.42,st.i*1.7+5)*10*st.s, r=st.r+nz(T*.37,st.i*2.3+9)*9;
    st.cur={x,y,r};st.el.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(1)}) scale(${st.s})`);
  });
  // sieve
  const sx=SIEVE.x+nz(T*.4,11)*5, sy=SIEVE.y+nz(T*.5,12)*6, sr=nz(T*.45,13)*3.5;
  $('sieve').setAttribute('transform',`translate(${sx.toFixed(1)} ${sy.toFixed(1)}) rotate(${sr.toFixed(2)})`);
  // loose grains: ear -> sieve along a lazy current
  loose.forEach(g=>{
    let t=(T/g.dur+g.t)%1; const st=stalks[g.st];
    const a=st.cur.r*Math.PI/180, ex=st.cur.x+Math.sin(a)*48*st.s, ey=st.cur.y-Math.cos(a)*48*st.s;
    const e=ease(t), cx=lerp(ex,sx,e)+Math.sin(t*Math.PI)*nz(T*.3,g.seed)*60, cy=lerp(ey,sy-6,e)-Math.sin(t*Math.PI)*30;
    const op=t<.08?t/.08:t>.94?(1-t)/.06:1;
    g.el.setAttribute('transform',`translate(${cx.toFixed(1)} ${cy.toFixed(1)}) rotate(${(T*40+g.seed*50)%360})`);g.el.setAttribute('opacity',op.toFixed(2));
  });
  // sieve -> hopper
  const hx=HOP.x+nz(T*.38,21)*4, hy=HOP.y+nz(T*.46,22)*5;
  $('hopper').setAttribute('transform',`translate(${hx.toFixed(1)} ${hy.toFixed(1)})`);
  fall.forEach((g,i)=>{const t=(T/2.6+g.t)%1, e=t*t; const x=lerp(sx,hx,e)+Math.sin(t*6+i)*6, y=lerp(sy+18,hy-14,e);
    g.el.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(T*90+i*60)%360})`);g.el.setAttribute('opacity',(t>.9?(1-t)*10:1).toFixed(2));});
  // dust and husk peel off the sieve and drift away
  dust.forEach(d=>{const t=(T/4.2+d.t)%1, x=sx+d.side*(70+t*130), y=sy+6+t*40+nz(T*.6,d.seed)*16-Math.sin(t*3)*14;
    d.el.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(t*240+d.seed*40)%360})`);d.el.setAttribute('opacity',(Math.sin(t*Math.PI)*.9).toFixed(2));});
  // stone
  const ox=200, oy=860+nz(T*.35,31)*4;
  $('stone').setAttribute('transform',`translate(${ox} ${oy.toFixed(1)})`);
  const sh=1-(oy-856)/40; $('stoneShadow').setAttribute('rx',(112*sh).toFixed(1));
  const rot=T*22; $('furrows').setAttribute('transform',`rotate(${rot.toFixed(1)})`);
  marks.forEach(m=>{const a=m.a+rot*Math.PI/180, c=Math.cos(a); if(c<.15){m.el.setAttribute('d','');return;}
    const x=Math.sin(a)*112, y=m.y0+Math.cos(a)*24*0; m.el.setAttribute('d',`M${x.toFixed(1)} ${(m.y0+6).toFixed(1)}v${(m.h*c).toFixed(1)}`);m.el.setAttribute('opacity',c.toFixed(2));});
  drop.forEach((g,i)=>{const t=(T/1.4+g.t)%1; g.el.setAttribute('transform',`translate(${(hx+Math.sin(t*5+i)*2).toFixed(1)} ${lerp(hy+108,oy-4,t*t).toFixed(1)}) rotate(${(T*120+i*90)%360})`);g.el.setAttribute('opacity',(t>.85?(1-t)/.15:1).toFixed(2));});
  // ribbon of atta: silky, gently wandering, spout -> pack mouth
  const px=176+nz(T*.33,41)*6, py=1186+nz(T*.4,42)*6;
  $('pack').setAttribute('transform',`translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${(nz(T*.3,43)*2).toFixed(2)})`);
  const s0=[ox+156,oy+72], c1=[400+nz(T*.5,44)*8,oy+110], c2=[392+nz(T*.45,45)*12,oy+190], p1=[318+nz(T*.4,46)*12,oy+226+nz(T*.5,47)*8],
        c4=[px+8+nz(T*.5,48)*14,py-80], p2=[px,py+10];
  const d=`M${s0}C${c1} ${c2} ${p1}S${c4} ${p2}`.replace(/(\d+\.\d)\d+/g,'$1');
  ribbon.setAttribute('d',d);shade.setAttribute('d',d);hi.setAttribute('d',d);
  const rl=ribbon.getTotalLength();
  bran.forEach((b,i)=>{const u=(b.u+T*.09)%1, p=ribbon.getPointAtLength(u*rl);b.el.setAttribute('cx',(p.x+Math.sin(i*2.1)*5.5).toFixed(1));b.el.setAttribute('cy',(p.y+Math.cos(i*1.7)*4.5).toFixed(1));});
  // delivery loop (10 s)
  const L=10, k=(T%L)/L, travel=Math.min(1,k/.6), te=ease(travel);
  const p=road.getPointAtLength(te*roadLen), q=road.getPointAtLength(Math.min(roadLen,te*roadLen+2));
  const ang=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI;
  const r=$('rider'); r.setAttribute('transform',`translate(${p.x.toFixed(1)} ${(p.y+3).toFixed(1)}) rotate(${ang.toFixed(1)}) scale(.82)`);
  r.setAttribute('opacity',(k<.03?k/.03:k>.86?Math.max(0,1-(k-.86)/.05):1).toFixed(2));
  const open=k<.62?0:k<.66?(k-.62)/.04:k<.9?1:k<.95?1-(k-.9)/.05:0;
  $('door').setAttribute('width',(34-28*open).toFixed(1));
  $('veer').setAttribute('opacity',open.toFixed(2));
  $('doorPack').setAttribute('opacity',(k>.7&&k<.97?Math.min(1,(k-.7)/.03):0).toFixed(2));
}

/* loop, pause, visibility */
const btn=$('pause'), label=btn.querySelector('span'), icon=btn.querySelector('svg'), pIcon=icon.innerHTML;
let user=reduce, vis=true, T=reduce?6.6:0, last=0, raf=0;
function frame(now){raf=0;const dt=last?Math.min(.05,(now-last)/1000):0;last=now;T+=dt;render(T);loop();}
function loop(){if(!user&&vis&&!raf)raf=requestAnimationFrame(frame);}
function sync(){label.textContent=user?'Play':'Pause';btn.setAttribute('aria-pressed',String(user));
  icon.innerHTML=user?'<path d="M3 1.5L12.5 7L3 12.5Z" fill="currentColor"/>':pIcon;if(user||!vis){last=0;}loop();}
btn.addEventListener('click',()=>{user=!user;sync();});
new IntersectionObserver(es=>{vis=es[0].isIntersecting;if(vis)drawArrows();sync();},{threshold:.05}).observe($('stage'));
render(T);sync();
})();
</script>
